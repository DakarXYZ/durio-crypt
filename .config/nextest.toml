# CR-15: the live testkit profile (scripts/testkit-backend.sh test). The
# backend keeps its rate limits, so scenarios run a few at a time.
[profile.testkit]
test-threads = 3
slow-timeout = { period = "60s", terminate-after = 6 }
fail-fast = false

[profile.testkit.junit]
# target/nextest/testkit/junit.xml
path = "junit.xml"

# load and chaos (scripts/testkit-backend.sh load|chaos): one scenario at a
# time, they measure the whole stack or restart parts of it
[profile.testkit-serial]
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 10 }
fail-fast = false

[profile.testkit-serial.junit]
path = "junit.xml"
