[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]
# `cargo build/test/clippy` without `--workspace` covers the product crates only;
# the CR-01 spikes stay buildable as evidence (`cargo test -p spike-msc`).
default-members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
authors = ["DakarX"]
publish = false

[workspace.dependencies]
stoat-crypto-proto = { path = "crates/stoat-crypto-proto" }
stoat-crypto-fakeserver = { path = "crates/stoat-crypto-fakeserver" }
stoat-crypto = { path = "crates/stoat-crypto" }

# Exact pins (ADR 0001): update once a quarter in a separate PR.
matrix-sdk-crypto = { version = "=0.19.1", default-features = false, features = ["automatic-room-key-forwarding"] }
matrix-sdk-common = { version = "=0.19.1" }
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false, features = ["crypto-store", "bundled"] }
matrix-sdk-indexeddb = { version = "=0.19.1", default-features = false, features = ["e2e-encryption"] }
ruma = { version = "=0.17.0", features = ["client-api-c"] }

# RustCrypto and rand at the versions matrix-sdk-crypto 0.19.1 already pulls in
# (no new crates in the graph): attachments (CR-10), recovery key (CR-12)
aes = { version = "0.9.3", default-features = false, features = ["zeroize"] }
ctr = { version = "0.10.1", features = ["zeroize"] }
sha2 = "0.11"
subtle = "2.6"
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
rand_10 = { package = "rand", version = "0.10.2" }

# CR-13: Kotlin bindings (MPL-2.0, see deny.toml); proc-macro mode, no UDL
uniffi = { version = "=0.32.2", default-features = false }

async-lock = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
http = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

# dev
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# Android: UniFFI turns a panic into a Kotlin exception; `abort` would kill the app (CR-02)
panic = "unwind"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.release-size]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.dev]
# keeps rustc memory in Docker Desktop in check
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# passphrase tests run PBKDF2-SHA512 (500 000 rounds) in debug builds
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

# AAR (CR-13): `s`, not `z` — on ARM `s` is about as small and not slower
# (measured in bindings/android/README.md); unwind kept for the FFI fence
[profile.release-android]
inherits = "release"
opt-level = "s"
