# CI of the crypto core (CR-02). Read-only: nothing here publishes artifacts,
# packages or releases — the AAR is built and released by aar.yml (CR-13), npm by CR-14.
name: CI

on:
  push:
    branches: [main, "durio/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # default members: the product crates (spikes are kept as CR-01 evidence only)
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --no-fail-fast
      - run: cargo test --doc --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # build only; wasm-bindgen-test in headless Chrome/Node comes with CR-14 (stage 5)
      - run: cargo check --locked --target wasm32-unknown-unknown -p stoat-crypto -p stoat-crypto-proto

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # debug build of the FFI crate (the core included); release + size gate: aar.yml
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --locked -p stoat-crypto-ffi
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the contract digest is committed; a fixture change must update it on purpose
      # (and the backend copy, see scripts/fixtures-digest.sh)
      - run: scripts/fixtures-digest.sh --check
