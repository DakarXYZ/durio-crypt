[package]
name = "stoat-crypto-testkit"
description = "dur.io E2EE testkit: several devices running the crypto core against a live backend (CR-15)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
stoat-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# plain HTTP to the local stack; no TLS in the graph
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = { workspace = true, features = ["sink"] }
rand.workspace = true

[dev-dependencies]
sha2.workspace = true
# examples/peer.rs: the line protocol on stdin/stdout
tokio = { workspace = true, features = ["io-std", "io-util"] }

[lints]
workspace = true
