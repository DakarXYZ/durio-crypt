[package]
name = "spike-msc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
matrix-sdk-crypto = { version = "=0.19.1", features = ["automatic-room-key-forwarding"] }
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false, features = ["crypto-store", "bundled"] }
matrix-sdk-common = { version = "=0.19.1" }
ruma = { version = "=0.17.0", features = ["client-api-c", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
anyhow = "1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
